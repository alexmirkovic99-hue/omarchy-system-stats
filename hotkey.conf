# What hotkey.sh manages. Sourced by hotkey.sh and the tests.
# Two hotkeys, each its own marked block in bindings.lua and its own row in the
# panel: `toggle` hides/shows the stats, `menu` opens the widget's menu. Both
# appear in the Omarchy keybindings menu (SUPER + K) under their description.
# Descriptions: letters, digits, spaces and ".,()-" only (written into a Lua string).
ACTIONS=(toggle menu)

toggle_DESC='Expand or collapse System stats'
menu_DESC='Open System stats menu'

# Offered by Add > AUTO and used by AUTO mode, tried in order; the first chord
# nothing else uses is written. None of these is an Omarchy default binding
# (tests/test-defaults.sh checks), and no candidate appears in both lists.
toggle_DEFAULTS=("SUPER + CTRL + M" "SUPER + ALT + M" "CTRL + ALT + M" "SUPER + CTRL + SHIFT + M")
menu_DEFAULTS=("SUPER + CTRL + U" "SUPER + ALT + U" "CTRL + ALT + U" "SUPER + CTRL + SHIFT + U")
